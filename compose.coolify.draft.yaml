# Draft only: do not deploy until secrets, role login, TLS routing, recovery,
# and the relay binding are verified in an isolated environment.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    environment:
      LINEBOT_DATABASE_URL: ${LINEBOT_DATABASE_URL:?Set the restricted runtime database URL}
      LINEBOT_ENCRYPTION_KEY: ${LINEBOT_ENCRYPTION_KEY:?Set the encryption key}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the HTTPS site origin}
    networks: [edge, linebot_private]
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      LINEBOT_ADMIN_AUTH_DATABASE_URL: ${LINEBOT_ADMIN_AUTH_DATABASE_URL:?Set the restricted admin-auth database URL}
      LINEBOT_REVIEW_DATABASE_URL: ${LINEBOT_REVIEW_DATABASE_URL:?Set the restricted review database URL}
      LINEBOT_ADMIN_ENCRYPTION_KEY: ${LINEBOT_ADMIN_ENCRYPTION_KEY:?Set the separate administrator encryption key}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:?Set the HTTPS administrator origin}
    networks: [edge, linebot_private]
    mem_limit: 192m
    cpus: 0.5
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
  db_relay:
    build:
      context: .
      dockerfile: Dockerfile.pg-relay
    environment:
      LINEBOT_RELAY_BIND_NAME: linebot-pg-relay-private
      LINEBOT_DB_HOST: ${LINEBOT_DB_HOST:?Set the existing Supabase database container name}
    networks:
      linebot_private:
        aliases: [linebot-pg-relay-private]
      supabase_private: {}
    mem_limit: 64m
    cpus: 0.25
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
networks:
  edge:
    external: true
    name: ${COOLIFY_NETWORK:-coolify}
  linebot_private:
    internal: true
  supabase_private:
    external: true
    name: ${SUPABASE_PRIVATE_NETWORK:?Set the existing Supabase network}
