<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服務條款 · LINEBOT 接線站</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/about">
        <span class="brand-mark" aria-hidden="true">L</span>
        <strong>LINEBOT 接線站</strong>
      </a>
    </div>
  </header>
  <main class="workspace-shell">
    <div class="public-info">
      <div class="page-heading"><h1>服務條款</h1></div>
      <section class="panel" aria-labelledby="workspace-title">
        <h2 id="workspace-title">帳號與網站</h2>
        <p>接線站供網站管理者透過 LINE 官方帳號發送事件通知。請使用你有權管理的網站與 LINE 官方帳號。接線站管理員可依服務使用情形審核、啟用或停用帳號。</p>
      </section>
      <section class="panel section-gap" aria-labelledby="notification-title">
        <h2 id="notification-title">收件者與通知</h2>
        <p>請在收件者同意後將其加入通知名單，並依約定用途發送通知。LINE Bot 憑證與事件 Webhook 網址可授權發送，請存放在有權管理的網站或接線站內。</p>
        <p>發送紀錄顯示接線站處理與 LINE 受理狀態。重要通知請另確認收件結果。</p>
      </section>
      <section class="panel section-gap" aria-labelledby="support-title">
        <h2 id="support-title">資料與支援</h2>
        <p>資料使用方式請閱讀<a class="text-link" href="/privacy">隱私權政策</a>。若有帳號或通知問題，請聯絡接線站管理員。</p>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <nav class="public-footer-links" aria-label="接線站資訊">
      <a class="text-link" href="/about">關於接線站</a>
      <a class="text-link" href="/privacy">隱私權政策</a>
    </nav>
  </footer>
</body>
</html>
